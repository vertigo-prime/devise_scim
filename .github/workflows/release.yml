name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version component to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
        with:
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 1

      - name: Run test suite
        run: bundle exec rspec

      - name: Bump version
        id: bump
        run: |
          current=$(ruby -r ./lib/devise_scim/version -e "puts DeviseScim::VERSION")
          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.version_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

          sed -i "s/VERSION = \"$current\"/VERSION = \"$new\"/" lib/devise_scim/version.rb

      - name: Update lockfile
        run: bundle install
        env:
          BUNDLE_FROZEN: "false"

      - name: Update CHANGELOG
        run: |
          today=$(date +%Y-%m-%d)
          new="${{ steps.bump.outputs.new }}"
          sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [$new] - $today/" CHANGELOG.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/devise_scim/version.rb CHANGELOG.md Gemfile.lock
          git commit -m "chore: release v${{ steps.bump.outputs.new }}"
          git tag "v${{ steps.bump.outputs.new }}"
          git push --follow-tags

      - name: Build gem
        run: gem build devise_scim.gemspec

      - uses: rubygems/release-gem@6317d8d1f7e28c24d28f6eff169ea854948bd9f7 # v1.2.0
#      - name: Push to RubyGems
#        env:
#          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
#        run: gem push "devise_scim-${{ steps.bump.outputs.new }}.gem"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.bump.outputs.new }}"
          gh release create "v$version" \
            --title "v$version" \
            --target "$(git rev-parse HEAD)" \
            --notes "See [CHANGELOG.md](https://github.com/vertigo-prime/devise_scim/blob/main/CHANGELOG.md) for details."
