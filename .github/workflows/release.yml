name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version component to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
        with:
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 1

      - name: Run test suite
        run: bundle exec rspec

      - name: Bump version
        id: bump
        run: |
          current=$(ruby -r ./lib/devise_scim/version -e "puts DeviseScim::VERSION")
          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.version_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

          sed -i "s/VERSION = \"$current\"/VERSION = \"$new\"/" lib/devise_scim/version.rb

      - name: Update lockfile
        run: bundle install
        env:
          BUNDLE_FROZEN: "false"

      - name: Update CHANGELOG
        env:
          NEW_VER: ${{ steps.bump.outputs.new }}
          PREV_VER: ${{ steps.bump.outputs.current }}
        run: |
          today=$(date +%Y-%m-%d)
          prev_tag="v${PREV_VER}"

          if git rev-parse "$prev_tag" >/dev/null 2>&1; then
            commits=$(git log "${prev_tag}..HEAD" --no-merges --format="- %s")
          else
            commits=""
          fi

          export TODAY="$today"
          export COMMITS="$commits"

          ruby -e '
            content  = File.read("CHANGELOG.md")
            new_ver  = ENV.fetch("NEW_VER")
            today    = ENV.fetch("TODAY")
            commits  = ENV.fetch("COMMITS", "")

            section  = "\n\n## [#{new_ver}] - #{today}"
            section += "\n\n#{commits}" unless commits.strip.empty?

            File.write("CHANGELOG.md", content.sub("## [Unreleased]", "## [Unreleased]#{section}"))
          '

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/devise_scim/version.rb CHANGELOG.md Gemfile.lock
          git commit -m "chore: release v${{ steps.bump.outputs.new }}"
          git tag "v${{ steps.bump.outputs.new }}"
          git push --follow-tags

      - name: Build and push gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem build devise_scim.gemspec
          gem push "devise_scim-${{ steps.bump.outputs.new }}.gem"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.bump.outputs.new }}"
          gh release create "v$version" \
            --title "v$version" \
            --target "$(git rev-parse HEAD)" \
            --notes "See [CHANGELOG.md](https://github.com/vertigo-prime/devise_scim/blob/main/CHANGELOG.md) for details."
